<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Eduardo Castro - Personal Trainer & Consultoria Online</title>
    <script type="text/javascript">
      // GitHub Pages não suporta rewrites de servidor para SPAs (React Router).
      // Este redirect converte a rota em querystring; index.html a reconstrói depois.
      // pathSegmentsToKeep = 1 assume um "Project Page" (https://usuario.github.io/repo/).
      // Se o site for publicado em https://usuario.github.io/ (User/Org Page), use 0.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
